<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾光搜尋 · Find your next discovery</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <header><a class="brand" href="/">拾光 <span>SEARCH</span></a><span class="badge">Powered by Tavily</span></header>
  <main>
    <section class="intro">
      <p class="eyebrow">A LITTLE CURIOSITY, A WORLD OF IDEAS</p>
      <h1>拾光</h1>
      <p class="description">輸入你的好奇，探索網路上的知識與可能。</p>
      <form id="search-form" role="search">
        <label class="sr-only" for="query">搜尋關鍵字</label>
        <div class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="query" name="q" type="search" placeholder="今天想探索什麼？" maxlength="200" required autocomplete="off"><button id="submit" type="submit">搜尋 <span aria-hidden="true">↗</span></button></div>
      </form>
      <div class="suggestions"><span>試試搜尋</span><button type="button" data-query="台灣步道推薦">台灣步道推薦</button><button type="button" data-query="Java 資料結構">Java 資料結構</button><button type="button" data-query="永續建築">永續建築</button></div>
    </section>
    <section class="results-section" aria-label="搜尋結果" aria-busy="false">
      <p id="status" role="status" aria-live="polite">每一次探索，都從好奇開始。</p>
      <div id="results"></div>
    </section>
  </main>
  <footer><span>拾光搜尋</span><span>探索・發現・連結</span><span>HW8 / Search API Project</span></footer>
</body>
</html>
